name: CI

# TASK 2: no existing .github/ conventions in this repo to match (none
# existed before this workflow) — this is the first one, so it sets the
# convention rather than following one.
on:
  push:
  pull_request:

# A second push to the same branch/PR cancels the still-running CI for the
# previous one — no point finishing a check on code that's already stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Frontend: install, lint, typecheck. No DB/queue involved — kept as its
  # own job (rather than folded into `backend`) so it runs in parallel with
  # the ~34s backend suite instead of adding to it serially.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # NOTE: Task 1's lint backlog (frontend: 102 warnings, 0 errors) means
      # `npm run lint` currently exits 0 on its own — continue-on-error is
      # kept anyway so a warning-only regression here never blocks CI, per
      # the task's explicit "lint failures may warn rather than fail for
      # now" instruction. Test failures below have no such allowance.
      - run: npm run lint
        continue-on-error: true

      # tsc -b (build's own project-reference step) — matches `npm run
      # build`'s own first command, without the `vite build` half (CI has no
      # reason to actually produce a bundle just to prove the types compile).
      - run: npx tsc -b

  # Backend: install, lint, run the full `node --test` suite against real
  # Mongo + Redis service containers (the suite needs both — see this
  # session's own work making it pass deterministically with no manual DB
  # clearing).
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # mongo:7 / redis:7-alpine — pinned to match docker-compose.yml exactly
    # (the versions this app actually runs against in production), not
    # guessed or left at `latest`.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/pha-ci
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      # NOTE: config/index.js#security.encryptionKey has no default and
      # tokenCipher.js throws without one — any test touching an encrypted
      # field (eBay refresh_token, etc.) needs a real 32-byte hex value. This
      # is a throwaway CI-only key with no connection to any real
      # environment's ENCRYPTION_KEY — fine to keep in plain text here.
      ENCRYPTION_KEY: f83f23af10d3e32db8ed137df9a1d8e5f5d817e0623b20ad0f051ce18228d9d5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # Same non-blocking treatment as the frontend job — see that job's
      # NOTE. Backend currently: 0 errors, 213 warnings.
      - run: npm run lint
        continue-on-error: true

      # Must fail the build — this is the one step Task 2 explicitly does
      # NOT get a continue-on-error/retry allowance. The suite is ~34s
      # locally and deterministic (186 tests, verified twice back-to-back
      # with no manual DB clearing); no retries added here on purpose — a
      # flaky run in CI is a real finding, not something to paper over.
      - run: npm test
