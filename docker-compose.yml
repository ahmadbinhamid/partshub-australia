services:
  dashboard-web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    hostname: dashboard-web
    restart: unless-stopped
    networks:
      - pha-net

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    hostname: backend
    env_file: ./server/.env.production
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      - mongo
      - redis
      - typesense
    restart: unless-stopped
    networks:
      - default
      - pha-net

  # Replaces the old worker-ebay — same container role, now runs the
  # channel-agnostic worker (workers/channel.worker.js) covering every
  # registered marketplace adapter, not just eBay. See
  # server/docs/channel-architecture.md for the deploy order this depends on
  # (code deploy must land before this rename takes effect).
  worker-channels:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: node --max-old-space-size=256 src/workers/channel.worker.js
    env_file: ./server/.env.production
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  worker-stripe:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: node --max-old-space-size=256 src/workers/stripe.worker.js
    env_file: ./server/.env.production
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  # Replaces the old worker-email + worker-search — both are low-volume job
  # types that don't need a dedicated container each; merged into one
  # process (workers/platform.worker.js).
  worker-platform:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: node --max-old-space-size=256 src/workers/platform.worker.js
    env_file: ./server/.env.production
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      - mongo
      - redis
      - typesense
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  typesense:
    image: typesense/typesense:27.1
    environment:
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-xyz}
      - TYPESENSE_DATA_DIR=/data
    volumes:
      - typesense_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  uploads:
  logs:
  typesense_data:

networks:
  pha-net:
    external: true
